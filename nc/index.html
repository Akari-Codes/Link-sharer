<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Via NC Public</title>
<h2>Convert Internal Nextcloud Share to External Share:</h2>
<button onclick="window.location.replace('../share-dl.html')">Back</button>
<p>Enter NC Share:</p>
<input id="share", placeholder="Enter NC Share...">
<button id="make_share" onclick="directlink()">Submit</button>
<p id="share_url"></p>
<p id="full"></p>
<br>
<script>
function format_share(url) {
var share = url.replace("http://100.96.132.93:4434", "https://akaris-main.ferret-smoot.ts.net:10000");
document.getElementById('share_url').innerHTML = "Your Share URL - <a href='" + share + "'>" + share + "</a>";
var sharea = "https://akari-codes.github.io/Link-sharer/index.html?url=" + share;
document.getElementById('full').innerHTML = "Your Full Share URL - <a href='" + sharea + "'>" + sharea + "</a>";
};
function directlink() {
var url = document.getElementById('share').value;
format_share(url);
};
</script>
