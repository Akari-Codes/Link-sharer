<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Content Via URL</title>
<h2>Create a Share:</h2>
<p>Share Type</p>
<select id="share_type">
    <option value="direct-link">Direct Link</option>
    <option value="google-drive-share">Google Drive Share</option>
</select>
<p>Enter URL:</p>
<input id="share", placeholder="Enter Share...">
<button onclick="new_share()">Submit</button>
<p id="preview_text"></p>
<iframe id="preview" width="300px" style="display:none;"></iframe>
<p id="share_url"></p>
<script src="share.js"></script>
