<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Content Via URL</title>
<h2>Create a Share:</h2>
<p>Share Type</p>
<select id="share_type">
    <option value="directlink">Direct Link</option>
    <option value="gdrive">Google Drive Share</option>
</select>
<button onclick="reload()">Set</button>
<p>Enter URL:</p>
<input id="share", placeholder="Enter Share...">
<button id="make_share" onclick="()">Submit</button>
<p id="preview_text"></p>
<iframe id="preview" width="300px" style="display:none;"></iframe>
<p id="share_url"></p>
<script>
    function format_share(url) {
document.getElementById('preview_text').innerText = "Preview Content";
document.getElementById('preview').style.display = "inline-block";
document.getElementById('preview').src = url;
var share = "https://akari-codes.github.io/Link-sharer/index.html?url=" + url;
document.getElementById('share_url').innerText = "Your Share URL - " + share;
};
function gdrive() {
  var url = document.getElementById('share').value;
  url.replace('file/d/','uc?export=download&id=');
  url.replace('/view?usp=sharing','');
  format_share(url);
};
function directlink() {
var url = document.getElementById('share').value;
format_share(url);
};
function reload() {
var type = document.getElementById('share_type').value;
if(type == "directlink") {document.getElementById('make_share').onclick = "directlink()"};
if(type == "gdrive") {document.getElementById('make_share').onclick = "gdrive()"};
};
</script>
